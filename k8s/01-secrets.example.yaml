# Copy this file to 01-secrets.yaml, fill in real values, and DO NOT commit that file.
# Add "01-secrets.yaml" to .gitignore before you ever run `git init` on this project.
apiVersion: v1
kind: Secret
metadata:
  name: trading-secrets
  namespace: trading
type: Opaque
stringData:
  ALPACA_API_KEY: "REPLACE_ME"          # from alpaca.markets dashboard - use the PAPER key first
  ALPACA_SECRET_KEY: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"       # from console.anthropic.com/settings/keys
  POSTGRES_PASSWORD: "REPLACE_ME_WITH_A_REAL_PASSWORD"
  # Optional - fill both in to get buy/sell + daily summary alerts on Telegram.
  # Message @BotFather on Telegram to create a bot and get its token, then
  # message your new bot once (any text) so it can see your chat - get your
  # chat_id from https://api.telegram.org/bot<TOKEN>/getUpdates afterwards.
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""
