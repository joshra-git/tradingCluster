apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-tier-config
  namespace: trading
data:
  config.yaml: |
    # --- WHAT TO TRADE ---
    # Both true = agents split 50/50 between them.
    stocks_enabled: false
    crypto_enabled: true

    # --- capital tiers ---
    min_capital: 250
    max_capital: 500
    initial_pod_count: 2
    cull_floor_fraction: 0.2

    # --- risk limits ---
    max_position_pct: 0.25
    max_daily_loss_pct: 0.10
    pdt_day_trade_limit: 3

    # --- exits (crypto gets wider thresholds; it swings harder) ---
    exit_check_interval_seconds: 60
    take_profit_pct: 15.0
    default_stop_loss_pct: 8.0
    crypto_stop_loss_pct: 12.0
    crypto_take_profit_pct: 20.0

    # --- discovery and screening ---
    discovery_interval_seconds: 900
    min_price_floor: 5.0
    persistence_min_appearances: 2
    persistence_lookback: 3
    screen_top_n: 5
    trend_window_days: 5

    # --- pacing: stocks follow the US market session ---
    cycle_open_seconds: 90
    cycle_weekday_seconds: 600
    cycle_weekend_seconds: 3600
    holding_slowdown_factor: 3

    # --- pacing: crypto follows YOUR waking hours, not an exchange bell ---
    crypto_timezone: "Australia/Brisbane"
    crypto_active_start_hour: 7
    crypto_active_end_hour: 22
    cycle_crypto_active_seconds: 120
    cycle_crypto_quiet_seconds: 1800

    daily_call_budget: 1400
    reconcile_interval_seconds: 60
    # Dip-buy guardrails for crypto
    dip_buy_guardrails_enabled: true
    crypto_max_24h_runup_pct: 10
    crypto_min_pullback_from_high_pct: 2

