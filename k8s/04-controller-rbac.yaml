apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: trading
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller-pod-manager
  namespace: trading
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller-pod-manager-binding
  namespace: trading
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: trading
roleRef:
  kind: Role
  name: controller-pod-manager
  apiGroup: rbac.authorization.k8s.io
