apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: trading
spec:
  selector:
    app: dashboard
  ports:
    - port: 8095
      targetPort: 8095
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: trading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: trading-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8095
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://trading:$(POSTGRES_PASSWORD)@postgres.trading.svc.cluster.local:5432/trading"
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
